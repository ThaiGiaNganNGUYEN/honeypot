name: honeypot-lab

services:
  honeypot:
    build: .
    image: honeypot-lab
    command: ["python", "-m", "honeypot", "--bind", "0.0.0.0", "--dashboard-bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:2121:2121"
      - "127.0.0.1:8090:8090"
    volumes:
      - ./logs:/app/logs
      - ./keys:/app/keys

  elasticsearch:
    profiles: ["elk"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    profiles: ["elk"]
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    profiles: ["elk"]
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./logs:/var/log/honeypot:ro
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - elasticsearch

volumes:
  esdata:
